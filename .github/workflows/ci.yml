name: Quality checks and publishing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint, migrations and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.6'
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Check lint and formatting
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Check Django and migrations
        run: |
          uv run python manage.py check
          uv run python manage.py makemigrations --check --dry-run
          uv run python manage.py migrate --noinput
      - name: Run tests
        run: uv run pytest -q

  container:
    name: Build and publish container
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/matuszen/university-course-organizer
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          pull: true
          no-cache: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
      - name: Scan container for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          version: v0.76.2
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: table
      - name: Verify startup with an empty database
        id: smoke
        run: |
          docker run -d --name api-smoke -p 127.0.0.1:8000:8000 \
            -v smoke-data:/data \
            -e DJANGO_SECRET_KEY=test-container-secret \
            "$IMAGE:${{ github.sha }}"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/semesters/ > /tmp/response.json; then
              python -c 'import json; data = json.load(open("/tmp/response.json")); assert data["count"] == 0'
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Show container logs
        if: always() && steps.smoke.outcome != 'skipped'
        run: docker logs api-smoke
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified image
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
      - name: Clean up container
        if: always() && steps.smoke.outcome != 'skipped'
        run: docker rm -f api-smoke
