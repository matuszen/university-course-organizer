[project]
name = "university-course-organizer"
version = "0.1.0"
description = "API uczelnianego planu zajęć"
requires-python = ">=3.12,<3.13"
dependencies = ["django>=5.2,<5.3", "djangorestframework>=3.16,<4", "gunicorn>=23,<24"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-django>=4.11,<5", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
