<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan zajęć</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head><body class="bg-light">
<nav class="border-bottom bg-white"><div class="container py-3 d-flex flex-wrap align-items-center gap-3">
<a class="nav-link px-3 py-2 rounded {% if request.resolver_match.url_name != 'available-rooms' and request.resolver_match.url_name != 'login' %}active bg-primary text-white{% endif %}" {% if request.resolver_match.url_name == 'plan' %}aria-current="page"{% endif %} href="{% url 'plan' %}">Plan zajęć</a>
<a class="nav-link px-3 py-2 rounded {% if request.resolver_match.url_name == 'available-rooms' %}active bg-primary text-white{% endif %}" {% if request.resolver_match.url_name == 'available-rooms' %}aria-current="page"{% endif %} href="{% url 'available-rooms' %}">Wolne sale</a>
{% if user.is_authenticated %}<span class="ms-auto">{{ user.username }}</span><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn btn-outline-secondary">Wyloguj</button></form>
{% else %}<a class="ms-auto" href="{% url 'login' %}">Zaloguj się</a>{% endif %}
</div></nav><main class="container py-4">{% block content %}{% endblock %}</main></body></html>
